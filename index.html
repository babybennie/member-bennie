<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | Bennie Choco</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Thai",Tahoma,sans-serif;
  background:#fff5f8;
  color:#624953;
}

body{
  padding:20px 14px 45px;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   LOGIN
========================================================= */

.login-page{
  min-height:calc(100vh - 40px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  width:100%;
  max-width:400px;
  background:#fff;
  border:1px solid #f2dce4;
  border-radius:26px;
  padding:28px 21px 25px;
  box-shadow:0 15px 45px rgba(190,125,145,.13);
}

.login-logo{
  width:82px;
  height:82px;
  border-radius:50%;
  background:#fff0f5;
  border:1px solid #f0d5df;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 13px;
  font-size:34px;
}

.login-brand{
  text-align:center;
  color:#c87591;
  font-size:27px;
  font-weight:850;
}

.login-subtitle{
  text-align:center;
  color:#a98895;
  font-size:13px;
  margin-top:4px;
  margin-bottom:25px;
}

.login-label{
  display:block;
  font-size:14px;
  font-weight:750;
  color:#735763;
  margin-bottom:7px;
}

.login-field{
  margin-bottom:15px;
}

.login-input{
  width:100%;
  height:49px;
  border:1px solid #ead6de;
  border-radius:13px;
  padding:0 14px;
  outline:none;
  background:#fffafb;
  color:#624953;
  font-size:15px;
}

.login-input:focus{
  border-color:#dfa1b6;
  box-shadow:0 0 0 3px rgba(223,161,182,.13);
}

.login-btn{
  width:100%;
  height:51px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#dc91a9,#c87591);
  color:#fff;
  font-size:16px;
  font-weight:800;
  margin-top:5px;
  box-shadow:0 7px 18px rgba(200,117,145,.22);
}

.login-error{
  display:none;
  margin-top:13px;
  padding:11px 12px;
  border-radius:12px;
  background:#fff0f3;
  color:#bd647c;
  border:1px solid #f1d0d9;
  font-size:13px;
  text-align:center;
}

/* =========================================================
   APP
========================================================= */

.app{
  display:none;
  width:100%;
  max-width:1050px;
  margin:0 auto;
}

.app.show{
  display:block;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  background:#fff;
  border:1px solid #f1dbe3;
  border-radius:22px;
  padding:16px 17px;
  box-shadow:0 8px 28px rgba(190,125,145,.10);
  margin-bottom:15px;
}

.topbar-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand-wrap{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#fff0f5;
  border:1px solid #f0d5df;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.brand-title{
  color:#c87591;
  font-size:21px;
  font-weight:850;
}

.brand-sub{
  color:#a98a96;
  font-size:12px;
  margin-top:1px;
}

.logout-btn{
  border:1px solid #efd5de;
  background:#fff7fa;
  color:#bd6e88;
  border-radius:11px;
  padding:9px 12px;
  font-size:12px;
  font-weight:750;
}

/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.stat{
  background:#fff;
  border:1px solid #f1dbe3;
  border-radius:18px;
  padding:15px 13px;
  box-shadow:0 7px 22px rgba(190,125,145,.07);
}

.stat-label{
  color:#a48994;
  font-size:12px;
}

.stat-number{
  color:#c87591;
  font-size:25px;
  font-weight:850;
  margin-top:3px;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  background:#fff;
  border:1px solid #f1dbe3;
  border-radius:19px;
  padding:13px;
  margin-bottom:15px;
  box-shadow:0 7px 22px rgba(190,125,145,.07);
}

.search-box{
  width:100%;
  height:46px;
  border:1px solid #ead6de;
  border-radius:13px;
  padding:0 14px;
  outline:none;
  color:#624953;
  background:#fffafb;
  font-size:14px;
}

.search-box:focus{
  border-color:#dfa1b6;
  box-shadow:0 0 0 3px rgba(223,161,182,.12);
}

.toolbar-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.result-count{
  color:#a48994;
  font-size:12px;
}

.refresh-btn{
  border:1px solid #efd5de;
  background:#fff7fa;
  color:#bd6e88;
  border-radius:11px;
  padding:8px 12px;
  font-size:12px;
  font-weight:750;
}

/* =========================================================
   AGENTS
========================================================= */

.agents{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.agent{
  background:#fff;
  border:1px solid #f1dbe3;
  border-radius:21px;
  padding:16px;
  box-shadow:0 8px 27px rgba(190,125,145,.08);
}

.agent-top{
  display:flex;
  gap:13px;
  align-items:center;
}

.agent-photo{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff0f5;
  box-shadow:0 4px 13px rgba(150,90,110,.12);
  background:#fff0f5;
}

.agent-main{
  min-width:0;
  flex:1;
}

.agent-name{
  color:#6d4d58;
  font-size:17px;
  font-weight:850;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.agent-code{
  display:inline-block;
  margin-top:5px;
  padding:5px 9px;
  border-radius:999px;
  background:#fff0f5;
  color:#bd6e88;
  font-size:11px;
  font-weight:850;
  letter-spacing:.4px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  margin-top:7px;
}

.status.active{
  background:#edf8f1;
  color:#62a37b;
}

.status.inactive{
  background:#fff0f3;
  color:#bd6b80;
}

.agent-info{
  border-top:1px solid #f4e4e9;
  margin-top:14px;
  padding-top:11px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:4px 0;
  font-size:12px;
}

.info-label{
  color:#ad929d;
}

.info-value{
  color:#70535d;
  font-weight:700;
  text-align:right;
  word-break:break-word;
}

.contact-list{
  margin-top:5px;
}

.contact-item{
  padding:4px 0;
  color:#765863;
  font-size:12px;
  word-break:break-word;
}

.sales-list{
  color:#9d7080;
}

.agent-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:14px;
}

.action-btn{
  height:40px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
}

.edit-btn{
  border:1px solid #e9c6d1;
  background:#fff6f9;
  color:#b96781;
}

.toggle-btn{
  border:1px solid #e0d1d6;
  background:#faf7f8;
  color:#806b73;
}

.delete-btn{
  grid-column:1 / -1;
  border:1px solid #f0cbd4;
  background:#fff2f4;
  color:#c36b80;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  display:none;
  background:#fff;
  border:1px solid #f1dbe3;
  border-radius:21px;
  padding:42px 20px;
  text-align:center;
  color:#a98b96;
}

.empty-icon{
  font-size:36px;
  margin-bottom:8px;
}

.empty-title{
  color:#80636d;
  font-weight:800;
  font-size:16px;
}

.empty-sub{
  font-size:12px;
  margin-top:4px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(76,47,58,.42);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:470px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border:1px solid #f1dbe3;
  border-radius:23px;
  padding:21px;
  box-shadow:0 20px 60px rgba(90,50,65,.20);
}

.modal-title{
  color:#bd6e88;
  font-size:19px;
  font-weight:850;
  margin-bottom:17px;
}

.modal-field{
  margin-bottom:13px;
}

.modal-label{
  display:block;
  color:#735763;
  font-size:12px;
  font-weight:750;
  margin-bottom:6px;
}

.modal-input{
  width:100%;
  height:45px;
  border:1px solid #ead6de;
  border-radius:12px;
  padding:0 12px;
  outline:none;
  color:#624953;
  background:#fffafb;
  font-size:14px;
}

.modal-input:focus{
  border-color:#dfa1b6;
}

.modal-textarea{
  width:100%;
  min-height:80px;
  resize:vertical;
  border:1px solid #ead6de;
  border-radius:12px;
  padding:10px 12px;
  outline:none;
  color:#624953;
  background:#fffafb;
  font-size:14px;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:18px;
}

.save-btn{
  height:46px;
  border:0;
  border-radius:12px;
  background:#d4879f;
  color:#fff;
  font-weight:800;
}

.cancel-btn{
  height:46px;
  border:1px solid #ead6de;
  border-radius:12px;
  background:#fff8fa;
  color:#80636d;
  font-weight:800;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,248,250,.75);
  backdrop-filter:blur(3px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.loading.show{
  display:flex;
}

.loading-box{
  background:#fff;
  border:1px solid #f0dce3;
  border-radius:17px;
  padding:20px 25px;
  color:#80616d;
  font-size:14px;
  font-weight:750;
  box-shadow:0 10px 35px rgba(120,70,90,.15);
  text-align:center;
}

.spinner{
  width:29px;
  height:29px;
  border:3px solid #f1dce3;
  border-top-color:#d4879f;
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 9px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .agents{
    grid-template-columns:1fr;
  }

}

@media(max-width:430px){

  body{
    padding:13px 10px 35px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:12px 9px;
  }

  .stat-number{
    font-size:22px;
  }

  .topbar{
    border-radius:19px;
  }

  .brand-title{
    font-size:19px;
  }

  .logout-btn{
    padding:8px 9px;
  }

}

</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jicsdzjcsxlrutdhurqd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_IutojmB0Mm9JrpPoBNc2rg_y300UcFz";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   ELEMENTS
========================================================= */

const loginPage =
  document.getElementById("loginPage");

const app =
  document.getElementById("app");

const loginEmail =
  document.getElementById("loginEmail");

const loginPassword =
  document.getElementById("loginPassword");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const logoutBtn =
  document.getElementById("logoutBtn");

const totalCount =
  document.getElementById("totalCount");

const activeCount =
  document.getElementById("activeCount");

const inactiveCount =
  document.getElementById("inactiveCount");

const searchInput =
  document.getElementById("searchInput");

const refreshBtn =
  document.getElementById("refreshBtn");

const resultCount =
  document.getElementById("resultCount");

const agentsContainer =
  document.getElementById("agents");

const empty =
  document.getElementById("empty");

const editModal =
  document.getElementById("editModal");

const editCode =
  document.getElementById("editCode");

const editNickname =
  document.getElementById("editNickname");

const editLine =
  document.getElementById("editLine");

const editFacebook =
  document.getElementById("editFacebook");

const editInstagram =
  document.getElementById("editInstagram");

const editSales =
  document.getElementById("editSales");

const cancelEditBtn =
  document.getElementById("cancelEditBtn");

const saveEditBtn =
  document.getElementById("saveEditBtn");

const loading =
  document.getElementById("loading");


/* =========================================================
   DATA
========================================================= */

let allAgents = [];

let editingAgentId = null;


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

  loading.classList.add("show");

}

function hideLoading(){

  loading.classList.remove("show");

}


/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
  "click",
  login
);


loginPassword.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      login();
    }

  }
);


async function login(){

  const email =
    loginEmail.value.trim();

  const password =
    loginPassword.value;


  loginError.style.display =
    "none";


  if(!email || !password){

    showLoginError(
      "กรุณากรอกอีเมลและรหัสผ่าน"
    );

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "กำลังเข้าสู่ระบบ...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if(error){
      throw error;
    }


    if(!data.user){

      throw new Error(
        "ไม่พบข้อมูลผู้ใช้"
      );

    }


    /* ตรวจว่าเป็น Admin */

    const {
      data: isAdmin,
      error: adminError
    } =
      await supabaseClient.rpc(
        "is_admin"
      );


    if(adminError){
      throw adminError;
    }


    if(!isAdmin){

      await supabaseClient.auth.signOut();

      throw new Error(
        "บัญชีนี้ไม่มีสิทธิ์เข้าใช้งาน Admin"
      );

    }


    showApp();

    await loadAgents();

  }
  catch(error){

    console.error(error);

    showLoginError(
      error.message ||
      "เข้าสู่ระบบไม่สำเร็จ"
    );

  }
  finally{

    loginBtn.disabled = false;

    loginBtn.textContent =
      "เข้าสู่ระบบ";

  }

}


function showLoginError(message){

  loginError.textContent =
    message;

  loginError.style.display =
    "block";

}


/* =========================================================
   SHOW APP
========================================================= */

function showApp(){

  loginPage.style.display =
    "none";

  app.classList.add("show");

}


/* =========================================================
   CHECK CURRENT SESSION
========================================================= */

async function checkSession(){

  try{

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if(!data.session){
      return;
    }


    const {
      data: isAdmin,
      error
    } =
      await supabaseClient.rpc(
        "is_admin"
      );


    if(error || !isAdmin){

      await supabaseClient.auth.signOut();

      return;

    }


    showApp();

    await loadAgents();

  }
  catch(error){

    console.error(error);

  }

}


checkSession();


/* =========================================================
   LOAD AGENTS
========================================================= */

async function loadAgents(){

  showLoading();

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("agents")
        .select("*")
        .order(
          "joined_date",
          {
            ascending:false
          }
        );


    if(error){
      throw error;
    }


    allAgents =
      data || [];


    updateStats();

    renderAgents();

  }
  catch(error){

    console.error(error);

    alert(
      error.message ||
      "ไม่สามารถโหลดข้อมูลตัวแทนได้"
    );

  }
  finally{

    hideLoading();

  }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  const total =
    allAgents.length;

  const active =
    allAgents.filter(
      agent =>
        agent.status === "active"
    ).length;

  const inactive =
    allAgents.filter(
      agent =>
        agent.status !== "active"
    ).length;


  totalCount.textContent =
    total;

  activeCount.textContent =
    active;

  inactiveCount.textContent =
    inactive;

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  renderAgents
);


function getFilteredAgents(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  if(!keyword){
    return allAgents;
  }


  return allAgents.filter(
    agent => {

      const nickname =
        String(
          agent.nickname || ""
        ).toLowerCase();

      const code =
        String(
          agent.agent_code || ""
        ).toLowerCase();


      return (
        nickname.includes(keyword) ||
        code.includes(keyword)
      );

    }
  );

}


/* =========================================================
   RENDER
========================================================= */

function renderAgents(){

  const agents =
    getFilteredAgents();


  agentsContainer.innerHTML =
    "";


  resultCount.textContent =
    `แสดง ${agents.length} จาก ${allAgents.length} รายการ`;


  if(agents.length === 0){

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  agents.forEach(
    agent => {

      agentsContainer.appendChild(
        createAgentCard(agent)
      );

    }
  );

}


/* =========================================================
   CREATE CARD
========================================================= */

function createAgentCard(agent){

  const card =
    document.createElement("article");

  card.className =
    "agent";


  const photo =
    agent.photo_url ||
    "https://via.placeholder.com/150";


  const status =
    agent.status === "active";


  const contacts =
    agent.contacts || {};


  const sales =
    Array.isArray(
      agent.sales_channels
    )
      ? agent.sales_channels
      : [];


  const contactHTML = [

    contacts.LINE
      ? `<div class="contact-item">LINE: ${escapeHTML(contacts.LINE)}</div>`
      : "",

    contacts.Facebook
      ? `<div class="contact-item">Facebook: ${escapeHTML(contacts.Facebook)}</div>`
      : "",

    contacts.Instagram
      ? `<div class="contact-item">Instagram: ${escapeHTML(contacts.Instagram)}</div>`
      : ""

  ].join("");


  const salesText =
    sales
      .map(formatSalesName)
      .join(", ") || "-";


  card.innerHTML = `

    <div class="agent-top">

      <img
        class="agent-photo"
        src="${escapeAttribute(photo)}"
        alt="รูปตัวแทน"
      >

      <div class="agent-main">

        <div class="agent-name">
          ${escapeHTML(agent.nickname || "-")}
        </div>

        <div class="agent-code">
          ${escapeHTML(agent.agent_code || "-")}
        </div>

        <div class="status ${status ? "active" : "inactive"}">
          ${status ? "● Active" : "● Inactive"}
        </div>

      </div>

    </div>


    <div class="agent-info">

      <div class="info-row">

        <span class="info-label">
          วันที่สมัคร
        </span>

        <span class="info-value">
          ${formatThaiDate(agent.joined_date)}
        </span>

      </div>


      <div class="info-row">

        <span class="info-label">
          ช่องทางขาย
        </span>

        <span class="info-value sales-list">
          ${escapeHTML(salesText)}
        </span>

      </div>


      <div class="contact-list">

        ${
          contactHTML ||
          `<div class="contact-item">ไม่มีข้อมูลติดต่อ</div>`
        }

      </div>

    </div>


    <div class="agent-actions">

      <button
        class="action-btn edit-btn"
        type="button"
        data-action="edit"
      >
        ✏️ แก้ไข
      </button>

      <button
        class="action-btn toggle-btn"
        type="button"
        data-action="toggle"
      >
        ${status ? "ปิดใช้งาน" : "เปิดใช้งาน"}
      </button>

      <button
        class="action-btn delete-btn"
        type="button"
        data-action="delete"
      >
        🗑️ ลบตัวแทน
      </button>

    </div>

  `;


  card
    .querySelector(
      '[data-action="edit"]'
    )
    .addEventListener(
      "click",
      () => openEdit(agent)
    );


  card
    .querySelector(
      '[data-action="toggle"]'
    )
    .addEventListener(
      "click",
      () => toggleStatus(agent)
    );


  card
    .querySelector(
      '[data-action="delete"]'
    )
    .addEventListener(
      "click",
      () => deleteAgent(agent)
    );


  return card;

}


/* =========================================================
   EDIT
========================================================= */

function openEdit(agent){

  editingAgentId =
    agent.id;


  const contacts =
    agent.contacts || {};


  const sales =
    Array.isArray(
      agent.sales_channels
    )
      ? agent.sales_channels
      : [];


  editCode.value =
    agent.agent_code || "";

  editNickname.value =
    agent.nickname || "";

  editLine.value =
    contacts.LINE || "";

  editFacebook.value =
    contacts.Facebook || "";

  editInstagram.value =
    contacts.Instagram || "";

  editSales.value =
    sales.join(", ");


  editModal.classList.add("show");

}


/* =========================================================
   SAVE EDIT
========================================================= */

saveEditBtn.addEventListener(
  "click",
  saveEdit
);


async function saveEdit(){

  if(!editingAgentId){
    return;
  }


  const nickname =
    editNickname.value.trim();


  if(!nickname){

    alert(
      "กรุณากรอกชื่อเล่น"
    );

    return;

  }


  const contacts = {

    LINE:
      editLine.value.trim(),

    Facebook:
      editFacebook.value.trim(),

    Instagram:
      editInstagram.value.trim()

  };


  const salesChannels =
    editSales.value
      .split(",")
      .map(item => item.trim())
      .filter(Boolean)
      .map(normalizeSalesName);


  showLoading();


  try{

    const {
      error
    } =
      await supabaseClient
        .from("agents")
        .update({

          nickname,

          contacts,

          sales_channels:
            salesChannels

        })
        .eq(
          "id",
          editingAgentId
        );


    if(error){
      throw error;
    }


    closeEdit();

    await loadAgents();


  }
  catch(error){

    console.error(error);

    alert(
      error.message ||
      "ไม่สามารถบันทึกข้อมูลได้"
    );

  }
  finally{

    hideLoading();

  }

}


/* =========================================================
   CLOSE EDIT
========================================================= */

cancelEditBtn.addEventListener(
  "click",
  closeEdit
);


function closeEdit(){

  editingAgentId =
    null;

  editModal.classList.remove(
    "show"
  );

}


/* =========================================================
   TOGGLE STATUS
========================================================= */

async function toggleStatus(agent){

  const nextStatus =
    agent.status === "active"
      ? "inactive"
      : "active";


  const text =
    nextStatus === "active"
      ? "เปิดใช้งาน"
      : "ปิดใช้งาน";


  const confirmed =
    confirm(
      `ต้องการ${text} ${agent.nickname} (${agent.agent_code}) หรือไม่?`
    );


  if(!confirmed){
    return;
  }


  showLoading();


  try{

    const {
      error
    } =
      await supabaseClient
        .from("agents")
        .update({

          status:
            nextStatus

        })
        .eq(
          "id",
          agent.id
        );


    if(error){
      throw error;
    }


    await loadAgents();

  }
  catch(error){

    console.error(error);

    alert(
      error.message ||
      "ไม่สามารถเปลี่ยนสถานะได้"
    );

  }
  finally{

    hideLoading();

  }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteAgent(agent){

  const confirmed =
    confirm(
      `ต้องการลบตัวแทน "${agent.nickname}" (${agent.agent_code}) ใช่หรือไม่?\n\nข้อมูลนี้จะถูกลบออกจากระบบ`
    );


  if(!confirmed){
    return;
  }


  const confirmedAgain =
    confirm(
      "ยืนยันอีกครั้ง: ต้องการลบข้อมูลตัวแทนนี้จริง ๆ ใช่หรือไม่?"
    );


  if(!confirmedAgain){
    return;
  }


  showLoading();


  try{

    const {
      error
    } =
      await supabaseClient
        .from("agents")
        .delete()
        .eq(
          "id",
          agent.id
        );


    if(error){
      throw error;
    }


    await loadAgents();

  }
  catch(error){

    console.error(error);

    alert(
      error.message ||
      "ไม่สามารถลบตัวแทนได้"
    );

  }
  finally{

    hideLoading();

  }

}


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
  "click",
  loadAgents
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
  "click",
  async function(){

    await supabaseClient.auth.signOut();

    app.classList.remove(
      "show"
    );

    app.style.display =
      "none";

    loginPage.style.display =
      "flex";

    loginPassword.value =
      "";

  }
);


/* =========================================================
   MODAL OUTSIDE CLICK
========================================================= */

editModal.addEventListener(
  "click",
  function(e){

    if(e.target === editModal){
      closeEdit();
    }

  }
);


/* =========================================================
   FORMAT DATE
========================================================= */

function formatThaiDate(dateString){

  if(!dateString){
    return "-";
  }


  const date =
    new Date(dateString);


  if(Number.isNaN(date.getTime())){
    return "-";
  }


  return date.toLocaleDateString(
    "th-TH",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


/* =========================================================
   FORMAT SALES
========================================================= */

function formatSalesName(name){

  if(name === "Twitter"){
    return "𝕏 ทวิต";
  }

  return name;

}


function normalizeSalesName(name){

  if(
    name === "𝕏 ทวิต" ||
    name === "X" ||
    name === "Twitter"
  ){
    return "Twitter";
  }

  return name;

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHTML(value);

}
