<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bennie Choco Agent Center</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     "Noto Sans Thai", sans-serif;
        background:
            radial-gradient(circle at top left, #ffe8f0 0%, transparent 35%),
            radial-gradient(circle at bottom right, #f9dce7 0%, transparent 40%),
            #fff7fa;
        color: #684f5a;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px;
    }

    .container {
        width: 100%;
        max-width: 460px;
    }

    /* LOGO */
    .logo-area {
        text-align: center;
        margin-bottom: 28px;
    }

    .logo {
        width: 86px;
        height: 86px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: linear-gradient(145deg, #ffffff, #ffe9f0);
        border: 2px solid rgba(201, 117, 148, 0.25);
        box-shadow:
            0 12px 30px rgba(201, 117, 148, 0.18),
            inset 0 0 0 6px rgba(255,255,255,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c87591;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -1px;
    }

    .brand {
        margin: 0;
        color: #c87591;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .subtitle {
        margin: 8px 0 0;
        color: #a98594;
        font-size: 14px;
        line-height: 1.6;
    }

    /* CARD */
    .card {
        background: rgba(255,255,255,0.92);
        border: 1px solid rgba(216, 137, 163, 0.18);
        border-radius: 26px;
        padding: 24px 20px;
        box-shadow:
            0 18px 45px rgba(180, 100, 130, 0.10),
            0 4px 12px rgba(180, 100, 130, 0.06);
        backdrop-filter: blur(10px);
    }

    .section-title {
        text-align: center;
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: 750;
        color: #684f5a;
    }

    .section-subtitle {
        text-align: center;
        margin: 0 0 22px;
        font-size: 13px;
        color: #aa8d99;
    }

    /* BUTTONS */
    .menu-button {
        width: 100%;
        border: 0;
        background: #fff;
        border: 1px solid #f1d7e0;
        border-radius: 18px;
        padding: 17px 16px;
        margin-bottom: 13px;
        display: flex;
        align-items: center;
        text-align: left;
        cursor: pointer;
        transition: all 0.18s ease;
        box-shadow: 0 5px 14px rgba(190, 110, 140, 0.06);
        color: #684f5a;

        /* สำคัญสำหรับ <a> */
        text-decoration: none;
    }

    .menu-button:last-child {
        margin-bottom: 0;
    }

    .menu-button:active {
        transform: scale(0.985);
    }

    .menu-button:hover {
        transform: translateY(-2px);
        border-color: #e4a1b7;
        box-shadow: 0 9px 22px rgba(190, 110, 140, 0.12);
    }

    .icon {
        width: 50px;
        height: 50px;
        flex: 0 0 50px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-right: 14px;
    }

    .apply-icon {
        background: #ffeaf1;
    }

    .check-icon {
        background: #f9eafa;
    }

    .admin-icon {
        background: #f5e7f1;
    }

    .button-content {
        flex: 1;
        min-width: 0;
    }

    .button-title {
        display: block;
        font-size: 16px;
        font-weight: 750;
        color: #684f5a;
        margin-bottom: 4px;
    }

    .button-description {
        display: block;
        font-size: 12px;
        line-height: 1.5;
        color: #aa8d99;
    }

    .arrow {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #fff2f6;
        color: #c87591;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        flex: 0 0 30px;
        margin-left: 8px;
    }

    /* FOOTER */
    .footer {
        text-align: center;
        margin-top: 22px;
        color: #b99da8;
        font-size: 11px;
        line-height: 1.6;
    }

    .footer strong {
        color: #c87591;
        font-weight: 700;
    }

    /* MOBILE */
    @media (max-width: 380px) {
        body {
            padding: 18px 12px;
        }

        .card {
            padding: 20px 15px;
            border-radius: 22px;
        }

        .brand {
            font-size: 25px;
        }

        .menu-button {
            padding: 15px 13px;
        }

        .icon {
            width: 46px;
            height: 46px;
            flex-basis: 46px;
            font-size: 22px;
            margin-right: 11px;
        }

        .button-title {
            font-size: 15px;
        }

        .button-description {
            font-size: 11px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- LOGO / HEADER -->
    <div class="logo-area">

        <div class="logo">
            BC
        </div>

        <h1 class="brand">
            Bennie Choco
        </h1>

        <p class="subtitle">
            Agent Center<br>
            ศูนย์รวมระบบตัวแทน
        </p>

    </div>


    <!-- MENU CARD -->
    <div class="card">

        <h2 class="section-title">
            ระบบตัวแทน
        </h2>

        <p class="section-subtitle">
            กรุณาเลือกเมนูที่ต้องการ
        </p>


        <!-- APPLY -->
        <a
            class="menu-button"
            href="https://agentapply-bennie.netlify.app/"
        >

            <div class="icon apply-icon">
                📝
            </div>

            <div class="button-content">
                <span class="button-title">
                    สมัครเป็นตัวแทน
                </span>

                <span class="button-description">
                    สมัครสมาชิกตัวแทน Bennie Choco
                </span>
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <!-- CHECK -->
        <a
            class="menu-button"
            href="https://agentcheck-bennie.netlify.app/"
        >

            <div class="icon check-icon">
                🔎
            </div>

            <div class="button-content">
                <span class="button-title">
                    เช็คตัวแทน
                </span>

                <span class="button-description">
                    ตรวจสอบข้อมูลและสถานะตัวแทน
                </span>
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <!-- ADMIN -->
        <a
            class="menu-button"
            href="https://agentadmin-bennie.netlify.app/"
        >

            <div class="icon admin-icon">
                🔐
            </div>

            <div class="button-content">
                <span class="button-title">
                    เข้าสู่หลังบ้าน
                </span>

                <span class="button-description">
                    สำหรับผู้ดูแลระบบตัวแทน
                </span>
            </div>

            <div class="arrow">
                ›
            </div>

        </a>

    </div>


    <!-- FOOTER -->
    <div class="footer">
        <strong>Bennie Choco</strong><br>
        Agent Management System
    </div>

</div>

</body>
</html>
