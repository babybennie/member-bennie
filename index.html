<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>สมัครตัวแทน | Bennie Choco</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Thai",Tahoma,sans-serif;
  background:#fff5f8;
  color:#684f5a;
}

body{
  display:flex;
  justify-content:center;
  padding:22px 14px 40px;
}

.page{
  width:100%;
  max-width:520px;
}

/* ---------- HEADER ---------- */

.header{
  text-align:center;
  margin:8px 0 20px;
}

.logo{
  width:92px;
  height:92px;
  border-radius:50%;
  background:#fff;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 25px rgba(196,126,151,.15);
  border:1px solid #f1d9e2;
  overflow:hidden;
}

.logo span{
  font-size:35px;
}

.brand{
  font-size:28px;
  font-weight:800;
  color:#c87591;
  letter-spacing:.3px;
}

.subtitle{
  margin-top:5px;
  font-size:14px;
  color:#a98594;
}

/* ---------- CARD ---------- */

.card{
  background:#fff;
  border-radius:24px;
  padding:22px 18px 24px;
  box-shadow:0 10px 35px rgba(190,121,146,.11);
  border:1px solid #f1dce4;
}

.section-title{
  font-size:18px;
  font-weight:800;
  color:#745663;
  margin:0 0 18px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  color:#765966;
  margin:0 0 7px;
}

.required{
  color:#d47796;
}

.field{
  margin-bottom:17px;
}

input[type="text"],
input[type="url"]{
  width:100%;
  height:48px;
  border:1px solid #ead6df;
  border-radius:13px;
  padding:0 14px;
  font-size:15px;
  outline:none;
  color:#684f5a;
  background:#fffafb;
  transition:.2s;
}

input[type="text"]:focus,
input[type="url"]:focus{
  border-color:#dda2b8;
  box-shadow:0 0 0 3px rgba(221,162,184,.14);
}

input::placeholder{
  color:#b99eaa;
}

/* ---------- CONTACT ---------- */

.contact-box{
  background:#fff8fa;
  border:1px solid #f0dfe5;
  border-radius:17px;
  padding:14px;
}

.contact-row{
  margin-bottom:12px;
}

.contact-row:last-child{
  margin-bottom:0;
}

.contact-label{
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  color:#7d5d69;
}

.contact-label span{
  font-weight:500;
  color:#ae96a1;
}

/* ---------- CHECKBOX ---------- */

.check-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.check-item{
  position:relative;
}

.check-item input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.check-item label{
  margin:0;
  min-height:45px;
  display:flex;
  align-items:center;
  padding:9px 11px;
  border:1px solid #eadce2;
  border-radius:12px;
  background:#fffafb;
  cursor:pointer;
  font-weight:600;
  color:#765865;
  transition:.18s;
}

.check-item input:checked + label{
  background:#ffeaf1;
  border-color:#dda0b7;
  color:#b96280;
}

.check-item input:checked + label::after{
  content:"✓";
  margin-left:auto;
  font-weight:800;
  color:#c56d8b;
}

/* ---------- PHOTO ---------- */

.photo-area{
  border:1.5px dashed #dda9bb;
  border-radius:18px;
  padding:18px 14px;
  text-align:center;
  background:#fff9fb;
  cursor:pointer;
}

.photo-preview{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  display:none;
  margin:0 auto 10px;
  border:4px solid #fff;
  box-shadow:0 5px 18px rgba(150,90,115,.15);
}

.photo-icon{
  font-size:34px;
  margin-bottom:5px;
}

.photo-main{
  font-weight:700;
  color:#805c6b;
  font-size:14px;
}

.photo-sub{
  font-size:12px;
  color:#ad96a1;
  margin-top:4px;
}

#photoInput{
  display:none;
}

/* ---------- BUTTON ---------- */

.submit-btn{
  width:100%;
  height:54px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#df91ad,#c97594);
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(201,117,148,.23);
  margin-top:5px;
}

.submit-btn:active{
  transform:scale(.985);
}

.submit-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* ---------- NOTE ---------- */

.note{
  margin-top:14px;
  text-align:center;
  color:#a18b96;
  font-size:12px;
  line-height:1.6;
}

/* ---------- MODAL ---------- */

.modal{
  position:fixed;
  inset:0;
  background:rgba(67,43,53,.48);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:1000;
  backdrop-filter:blur(4px);
}

.modal.show{
  display:flex;
}

.success-card{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:25px;
  padding:25px 20px 22px;
  text-align:center;
  box-shadow:0 20px 60px rgba(80,45,60,.20);
  animation:pop .22s ease;
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.94);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.success-icon{
  font-size:42px;
  margin-bottom:4px;
}

.success-title{
  font-size:22px;
  font-weight:800;
  color:#765464;
}

.success-sub{
  font-size:13px;
  color:#a08793;
  margin:5px 0 18px;
}

.agent-card{
  border:1px solid #efdde4;
  border-radius:19px;
  padding:17px;
  background:#fff8fa;
}

.agent-photo{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #fff;
  box-shadow:0 5px 18px rgba(100,55,75,.15);
}

.agent-name{
  font-size:21px;
  font-weight:800;
  margin-top:10px;
  color:#745360;
}

.agent-code{
  display:inline-block;
  margin-top:6px;
  padding:7px 13px;
  border-radius:999px;
  background:#ffe9f0;
  color:#b75e7c;
  font-size:14px;
  font-weight:800;
  letter-spacing:.5px;
}

.agent-info{
  text-align:left;
  margin-top:15px;
  border-top:1px solid #f0e0e6;
  padding-top:12px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:5px 0;
  font-size:13px;
}

.info-label{
  color:#a18b96;
}

.info-value{
  color:#705360;
  font-weight:700;
  text-align:right;
}

.copy-btn{
  width:100%;
  height:45px;
  border:1px solid #ddaabd;
  border-radius:12px;
  background:#fff;
  color:#8a5d6d;
  font-weight:800;
  margin-top:15px;
  cursor:pointer;
}

.copy-btn:active{
  background:#fff1f5;
}

.close-btn{
  width:100%;
  height:47px;
  border:0;
  border-radius:13px;
  background:#ca7593;
  color:#fff;
  font-weight:800;
  font-size:15px;
  margin-top:9px;
  cursor:pointer;
}

.close-btn:active{
  transform:scale(.985);
}

/* ---------- LOADING ---------- */

.loading{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,248,251,.72);
  z-index:2000;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(3px);
}

.loading.show{
  display:flex;
}

.loading-box{
  background:#fff;
  border-radius:18px;
  padding:22px 28px;
  box-shadow:0 10px 35px rgba(120,70,90,.13);
  text-align:center;
  color:#765462;
  font-weight:700;
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #f0dce4;
  border-top-color:#cf7896;
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 10px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:380px){

  .card{
    padding:19px 14px 21px;
  }

  .brand{
    font-size:25px;
  }

  .check-grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="page">

  <header class="header">

    <div class="logo">
      <span>🍫</span>
    </div>

    <div class="brand">
      Bennie Choco
    </div>

    <div class="subtitle">
      สมัครเป็นตัวแทนจำหน่าย
    </div>

  </header>

  <main class="card">

    <h1 class="section-title">
      แบบฟอร์มสมัครตัวแทน
    </h1>

    <!-- ชื่อเล่น -->

    <div class="field">

      <label>
        ชื่อเล่น <span class="required">*</span>
      </label>

      <input
        id="nickname"
        type="text"
        maxlength="50"
        placeholder="เช่น เบนนี่"
      >

    </div>

    <!-- ช่องทางติดต่อ -->

    <div class="field">

      <label>
        ช่องทางติดต่อ
        <span class="required">*</span>
      </label>

      <div class="contact-box">

        <div class="contact-row">

          <div class="contact-label">
            LINE <span>(ถ้ามี)</span>
          </div>

          <input
            id="lineContact"
            type="text"
            maxlength="100"
            placeholder="LINE ID"
          >

        </div>

        <div class="contact-row">

          <div class="contact-label">
            Facebook <span>(ถ้ามี)</span>
          </div>

          <input
            id="facebookContact"
            type="text"
            maxlength="150"
            placeholder="ชื่อหรือโปรไฟล์ Facebook"
          >

        </div>

        <div class="contact-row">

          <div class="contact-label">
            Instagram <span>(ถ้ามี)</span>
          </div>

          <input
            id="instagramContact"
            type="text"
            maxlength="100"
            placeholder="@username"
          >

        </div>

      </div>

    </div>

    <!-- ช่องทางการขาย -->

    <div class="field">

      <label>
        ช่องทางที่ใช้ขายสินค้า
        <span class="required">*</span>
      </label>

      <div class="check-grid">

        <div class="check-item">
          <input id="saleFacebook" type="checkbox" value="Facebook">
          <label for="saleFacebook">Facebook</label>
        </div>

        <div class="check-item">
          <input id="saleInstagram" type="checkbox" value="Instagram">
          <label for="saleInstagram">Instagram</label>
        </div>

        <div class="check-item">
          <input id="saleTikTok" type="checkbox" value="TikTok">
          <label for="saleTikTok">TikTok</label>
        </div>

        <div class="check-item">
          <input id="saleTwitter" type="checkbox" value="Twitter">
          <label for="saleTwitter">𝕏 ทวิต</label>
        </div>

        <div class="check-item">
          <input id="saleLINE" type="checkbox" value="LINE">
          <label for="saleLINE">LINE</label>
        </div>

        <div class="check-item">
          <input id="saleOther" type="checkbox" value="อื่น ๆ">
          <label for="saleOther">อื่น ๆ</label>
        </div>

      </div>

    </div>

    <!-- รูป -->

    <div class="field">

      <label>
        รูปโปรไฟล์
        <span class="required">*</span>
      </label>

      <label class="photo-area" for="photoInput">

        <img
          id="photoPreview"
          class="photo-preview"
          alt="รูปตัวแทน"
        >

        <div id="photoIcon" class="photo-icon">
          📷
        </div>

        <div id="photoMain" class="photo-main">
          แตะเพื่อเลือกรูปจากมือถือ
        </div>

        <div class="photo-sub">
          JPG / PNG / WEBP ขนาดไม่เกิน 5 MB
        </div>

      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

    </div>

    <button
      id="submitBtn"
      class="submit-btn"
      type="button"
    >
      สมัครเป็นตัวแทน
    </button>

    <div class="note">
      กรุณาตรวจสอบข้อมูลก่อนกดสมัคร<br>
      หลังสมัครสำเร็จ ระบบจะสร้างรหัสตัวแทนให้อัตโนมัติ
    </div>

  </main>

</div>

<!-- SUCCESS MODAL -->

<div id="successModal" class="modal">

  <div class="success-card">

    <div class="success-icon">
      🎉
    </div>

    <div class="success-title">
      สมัครสำเร็จ!
    </div>

    <div class="success-sub">
      ยินดีต้อนรับสู่ Bennie Choco
    </div>

    <div class="agent-card">

      <img
        id="agentPhoto"
        class="agent-photo"
        alt="รูปตัวแทน"
      >

      <div
        id="agentName"
        class="agent-name"
      ></div>

      <div
        id="agentCode"
        class="agent-code"
      ></div>

      <div class="agent-info">

        <div class="info-row">

          <span class="info-label">
            วันที่สมัคร
          </span>

          <span
            id="agentDate"
            class="info-value"
          ></span>

        </div>

        <div class="info-row">

          <span class="info-label">
            สถานะ
          </span>

          <span
            id="agentStatus"
            class="info-value"
          >
            Active
          </span>

        </div>

        <div class="info-row">

          <span class="info-label">
            ช่องทางขาย
          </span>

          <span
            id="agentSales"
            class="info-value"
          ></span>

        </div>

      </div>

      <button
        id="copyCodeBtn"
        class="copy-btn"
        type="button"
      >
        📋 คัดลอกรหัสตัวแทน
      </button>

    </div>

    <button
      id="closeModalBtn"
      class="close-btn"
      type="button"
    >
      เสร็จสิ้น
    </button>

  </div>

</div>

<!-- LOADING -->

<div id="loading" class="loading">

  <div class="loading-box">

    <div class="spinner"></div>

    กำลังส่งข้อมูล...

  </div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jicsdzjcsxlrutdhurqd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_IutojmB0Mm9JrpPoBNc2rg_y300UcFz";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

/* =========================================================
   ELEMENTS
========================================================= */

const nicknameInput =
  document.getElementById("nickname");

const lineInput =
  document.getElementById("lineContact");

const facebookInput =
  document.getElementById("facebookContact");

const instagramInput =
  document.getElementById("instagramContact");

const photoInput =
  document.getElementById("photoInput");

const photoPreview =
  document.getElementById("photoPreview");

const photoIcon =
  document.getElementById("photoIcon");

const photoMain =
  document.getElementById("photoMain");

const submitBtn =
  document.getElementById("submitBtn");

const loading =
  document.getElementById("loading");

const successModal =
  document.getElementById("successModal");

const agentPhoto =
  document.getElementById("agentPhoto");

const agentName =
  document.getElementById("agentName");

const agentCode =
  document.getElementById("agentCode");

const agentDate =
  document.getElementById("agentDate");

const agentStatus =
  document.getElementById("agentStatus");

const agentSales =
  document.getElementById("agentSales");

const copyCodeBtn =
  document.getElementById("copyCodeBtn");

const closeModalBtn =
  document.getElementById("closeModalBtn");

/* =========================================================
   PHOTO PREVIEW
========================================================= */

let selectedPhoto = null;

photoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("กรุณาเลือกไฟล์รูปภาพ");
    this.value = "";
    return;
  }

  if(file.size > 5 * 1024 * 1024){
    alert("รูปมีขนาดเกิน 5 MB");
    this.value = "";
    return;
  }

  selectedPhoto = file;

  const reader = new FileReader();

  reader.onload = function(e){

    photoPreview.src = e.target.result;
    photoPreview.style.display = "block";

    photoIcon.style.display = "none";

    photoMain.textContent =
      "เปลี่ยนรูปภาพ";

  };

  reader.readAsDataURL(file);

});

/* =========================================================
   GET SALES CHANNELS
========================================================= */

function getSalesChannels(){

  const ids = [
    "saleFacebook",
    "saleInstagram",
    "saleTikTok",
    "saleTwitter",
    "saleLINE",
    "saleOther"
  ];

  return ids
    .map(id => document.getElementById(id))
    .filter(input => input.checked)
    .map(input => input.value);

}

/* =========================================================
   SUBMIT
========================================================= */

submitBtn.addEventListener("click", async function(){

  const nickname =
    nicknameInput.value.trim();

  const line =
    lineInput.value.trim();

  const facebook =
    facebookInput.value.trim();

  const instagram =
    instagramInput.value.trim();

  const salesChannels =
    getSalesChannels();

  /* ---------- VALIDATE ---------- */

  if(!nickname){

    alert("กรุณากรอกชื่อเล่น");

    nicknameInput.focus();

    return;
  }

  if(!line && !facebook && !instagram){

    alert("กรุณากรอกช่องทางติดต่ออย่างน้อย 1 ช่องทาง");

    lineInput.focus();

    return;
  }

  if(salesChannels.length === 0){

    alert("กรุณาเลือกช่องทางที่ใช้ขายสินค้าอย่างน้อย 1 ช่องทาง");

    return;
  }

  if(!selectedPhoto){

    alert("กรุณาเลือกรูปโปรไฟล์");

    return;
  }

  /* ---------- START ---------- */

  loading.classList.add("show");

  submitBtn.disabled = true;

  try{

    /* =========================================
       1. UPLOAD PHOTO
    ========================================= */

    const extension =
      selectedPhoto.name
        .split(".")
        .pop()
        .toLowerCase();

    const fileName =
      crypto.randomUUID() + "." + extension;

    const filePath =
      "agents/" + fileName;

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("agent-photos")
        .upload(
          filePath,
          selectedPhoto,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:selectedPhoto.type
          }
        );

    if(uploadError){

      console.error(uploadError);

      throw new Error(
        "ไม่สามารถอัปโหลดรูปได้"
      );

    }

    /* =========================================
       2. GET PUBLIC PHOTO URL
    ========================================= */

    const {
      data: publicUrlData
    } =
      supabaseClient
        .storage
        .from("agent-photos")
        .getPublicUrl(filePath);

    const photoUrl =
      publicUrlData.publicUrl;

    /* =========================================
       3. CONTACTS
    ========================================= */

    const contacts = {

      LINE: line || "",

      Facebook: facebook || "",

      Instagram: instagram || ""

    };

    /* =========================================
       4. REGISTER AGENT
    ========================================= */

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "register_agent",
        {
          p_nickname: nickname,
          p_photo_url: photoUrl,
          p_contacts: contacts,
          p_sales_channels: salesChannels
        }
      );

    if(error){

      console.error(error);

      throw new Error(
        error.message ||
        "ไม่สามารถสมัครตัวแทนได้"
      );

    }

    /* =========================================
       5. GET RESULT
    ========================================= */

    let agent = data;

    if(Array.isArray(data)){
      agent = data[0];
    }

    if(!agent){

      throw new Error(
        "ระบบสมัครสำเร็จแต่ไม่พบข้อมูลตัวแทน"
      );

    }

    /* =========================================
       6. SHOW SUCCESS
    ========================================= */

    showSuccess(agent);

  }
  catch(error){

    console.error(error);

    alert(
      error.message ||
      "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง"
    );

  }
  finally{

    loading.classList.remove("show");

    submitBtn.disabled = false;

  }

});

/* =========================================================
   SHOW SUCCESS
========================================================= */

function showSuccess(agent){

  const code =
    agent.agent_code || "";

  const name =
    agent.nickname || nicknameInput.value.trim();

  const photo =
    agent.photo_url || "";

  const joined =
    agent.joined_date ||
    new Date().toISOString();

  const status =
    agent.status || "active";

  const sales =
    agent.sales_channels || [];

  agentPhoto.src = photo;

  agentName.textContent = name;

  agentCode.textContent = code;

  agentDate.textContent =
    formatThaiDate(joined);

  agentStatus.textContent =
    status === "active"
      ? "Active"
      : "Inactive";

  agentSales.textContent =
    Array.isArray(sales)
      ? sales.map(formatSalesName).join(", ")
      : "";

  copyCodeBtn.dataset.code =
    code;

  successModal.classList.add("show");

}

/* =========================================================
   FORMAT DATE
========================================================= */

function formatThaiDate(dateString){

  const date =
    new Date(dateString);

  return date.toLocaleDateString(
    "th-TH",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}

/* =========================================================
   FORMAT SALES
========================================================= */

function formatSalesName(name){

  if(name === "Twitter"){
    return "𝕏 ทวิต";
  }

  return name;

}

/* =========================================================
   COPY CODE
========================================================= */

copyCodeBtn.addEventListener(
  "click",
  async function(){

    const code =
      this.dataset.code || "";

    if(!code){
      return;
    }

    try{

      await navigator.clipboard.writeText(code);

      this.textContent =
        "✓ คัดลอกแล้ว";

      setTimeout(() => {

        this.textContent =
          "📋 คัดลอกรหัสตัวแทน";

      },1500);

    }
    catch(error){

      alert(
        "รหัสตัวแทน: " + code
      );

    }

  }
);

/* =========================================================
   CLOSE MODAL
========================================================= */

closeModalBtn.addEventListener(
  "click",
  function(){

    successModal.classList.remove("show");

  }
);

/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

successModal.addEventListener(
  "click",
  function(e){

    if(e.target === successModal){

      successModal.classList.remove("show");

    }

  }
);

</script>

</body>
</html>
